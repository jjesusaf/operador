<text x="30" y="42" class="h">Operador — agente que opera apps sin API, solo por pantalla</text>
<text x="30" y="66" class="s">Arquitectura final · Frontier CDMX · 31 oct 2026 · Jesús Acevedo · corrida oficial: 2/34 → 38/42 (fáciles 13/13 · regulares 14/17 · difíciles 11/12)</text>

<!-- Evaluator -->
<rect x="30" y="110" width="200" height="140" rx="10" fill="#f1f3f7" stroke="#8a93a6" stroke-dasharray="6 4"/>
<text x="44" y="136" class="t">Evaluador</text>
<text x="44" y="158" class="m">POST /tasks</text>
<text x="44" y="176" class="m">GET /tasks/{id} c/5s</text>
<text x="44" y="194" class="m">GET /health</text>
<text x="44" y="218" class="s">Bearer token · 5 min</text>
<text x="44" y="236" class="s">por tarea</text>

<!-- Cloudflare edge -->
<rect x="270" y="90" width="430" height="300" rx="14" fill="#fff8f0" stroke="#f38020" stroke-width="2"/>
<text x="288" y="117" class="t" style="fill:#c2570c">Cloudflare · borde</text>
<rect x="290" y="132" width="390" height="120" rx="10" fill="#fff" stroke="#3b4456"/>
<text x="304" y="156" class="t">Worker (Hono) — puerta de entrada</text>
<text x="304" y="178" class="s">• auth Bearer · valida el cuerpo</text>
<text x="304" y="196" class="s">• responde task_id en ~200 ms (encola, no trabaja)</text>
<text x="304" y="214" class="s">• /health siempre 200 y despierta el contenedor</text>
<text x="304" y="232" class="s">• estado: refresca desde el contenedor</text>
<rect x="290" y="268" width="185" height="105" rx="10" fill="#fff" stroke="#3b4456"/>
<text x="304" y="292" class="t">D1 (SQLite)</text>
<text x="304" y="313" class="s">tasks: ledger de</text>
<text x="304" y="330" class="s">estado y resumen</text>
<text x="304" y="350" class="s">app_notes: cuaderno</text>
<text x="304" y="366" class="s">por app (huella)</text>
<rect x="495" y="268" width="185" height="105" rx="10" fill="#fff" stroke="#3b4456"/>
<text x="509" y="292" class="t">Durable Object</text>
<text x="509" y="313" class="s">ciclo de vida del</text>
<text x="509" y="330" class="s">contenedor: arranque,</text>
<text x="509" y="347" class="s">env, KEEP_ALIVE,</text>
<text x="509" y="364" class="s">reinicio</text>

<!-- Container -->
<rect x="270" y="420" width="1010" height="560" rx="14" fill="#fbfaff" stroke="#6d4fd6" stroke-width="2"/>
<text x="288" y="447" class="t" style="fill:#6d4fd6">Cloudflare Container · Docker (Node 22) · monorepo pnpm + Turborepo</text>
<rect x="290" y="462" width="300" height="100" rx="10" fill="#fff" stroke="#3b4456"/>
<text x="304" y="486" class="t">API NestJS</text>
<text x="304" y="507" class="s">cola: 1 tarea por escritorio,</text>
<text x="304" y="524" class="s">2 en paralelo · deadline desde el POST</text>
<text x="304" y="541" class="s">llaves: evento (oficial) / dev (pruebas)</text>

<rect x="610" y="462" width="650" height="100" rx="10" fill="#f5f0ff" stroke="#6d4fd6"/>
<text x="624" y="486" class="t">Enrutador por dificultad</text>
<text x="624" y="508" class="s">tarea simple (1 paso, pregunta, exporte) → <tspan class="k">Claude Haiku 5.5</tspan>  · ~US$0.005 · 1–2 s/turno</text>
<text x="624" y="528" class="s">cadena / condicional / agenda / bitácora / totales → <tspan class="k">Claude Sonnet 5.5</tspan>  + turno de plan</text>
<text x="624" y="548" class="s">vía OpenRouter · caché de prompt incremental · cuaderno mantenido por Haiku</text>

<!-- Loop -->
<rect x="290" y="580" width="970" height="250" rx="12" fill="#fff" stroke="#3b4456"/>
<text x="304" y="604" class="t">Bucle del agente (máx 4:30 min · 60 turnos · US$2.50)</text>
<rect x="310" y="620" width="170" height="120" rx="8" fill="#eef6ff" stroke="#3d7bd9"/>
<text x="322" y="643" class="t">1 · Observar</text>
<text x="322" y="664" class="s">captura 1280×800</text>
<text x="322" y="681" class="s">al estabilizarse</text>
<text x="322" y="698" class="s">+ cuaderno de la app</text>
<text x="322" y="715" class="s">+ notas de la tarea</text>
<rect x="500" y="620" width="190" height="120" rx="8" fill="#eef6ff" stroke="#3d7bd9"/>
<text x="512" y="643" class="t">2 · Decidir</text>
<text x="512" y="664" class="m">computer: click·type·key</text>
<text x="512" y="681" class="m">scroll·wait·zoom</text>
<text x="512" y="698" class="m">note · calc · report</text>
<text x="512" y="718" class="s">plan primero si es compleja</text>
<rect x="710" y="620" width="240" height="120" rx="8" fill="#fff6ec" stroke="#d98a2b"/>
<text x="722" y="643" class="t">3 · Guardias (código)</text>
<text x="722" y="664" class="s">report solo y con resumen</text>
<text x="722" y="681" class="s">bucle ×3 aviso · ×5 cierre</text>
<text x="722" y="698" class="s">teclas que cierran el kiosko</text>
<text x="722" y="715" class="s">sin secretos · respuesta: limpia</text>
<rect x="970" y="620" width="270" height="120" rx="8" fill="#eef6ff" stroke="#3d7bd9"/>
<text x="982" y="643" class="t">4 · Actuar por VNC</text>
<text x="982" y="664" class="s">rfb2 sobre WebSocket (sin navegador)</text>
<text x="982" y="681" class="s">clic con 200 ms · texto por keysym</text>
<text x="982" y="698" class="s">(ñ, tildes) · espera de repintado</text>
<text x="982" y="715" class="s">3 reintentos de conexión</text>
<line x1="480" y1="680" x2="497" y2="680" stroke="#3b4456" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="690" y1="680" x2="707" y2="680" stroke="#3b4456" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="950" y1="680" x2="967" y2="680" stroke="#3b4456" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1105,740 L1105,790 L395,790 L395,743" fill="none" stroke="#6d4fd6" stroke-width="1.6" marker-end="url(#p)"/>
<text x="560" y="812" class="l">repite hasta "report" (terminada/fallida honesta) o límite → resumen con lo encontrado</text>

<rect x="290" y="845" width="970" height="120" rx="10" fill="#f1f3f7" stroke="#8a93a6"/>
<text x="304" y="869" class="t">Reglas que ganaron puntos</text>
<text x="304" y="891" class="s">• Ante duda NO actúa: homónimos, registro inexistente, datos que no cuadran, borrado masivo → fallida nombrando la evidencia</text>
<text x="304" y="910" class="s">• Credenciales: fallida sin navegar · ante error de la app no reintenta · cuenta cada página con calc · "hoy" = fecha de la app</text>
<text x="304" y="929" class="s">• Incidente (tema v4.2): controles por su etiqueta, nunca por coordenadas · cierra modales · confía en la pantalla actual</text>
<text x="304" y="948" class="s">• Aprende entre tareas: cuaderno por huella visual (mapa de menús, trampas), sin datos de registros</text>

<!-- Desktop -->
<rect x="1330" y="560" width="250" height="250" rx="10" fill="#f1f3f7" stroke="#8a93a6" stroke-dasharray="6 4"/>

<text x="1345" y="606" class="s">(del evento, cambia por tarea)</text>

<rect x="1345" y="664" width="220" height="34" rx="6" fill="#fff" stroke="#8a93a6"/>

<rect x="1345" y="708" width="220" height="50" rx="6" fill="#fff" stroke="#8a93a6"/>
<text x="1357" y="729" class="s">Chromium kiosko →</text>
<text x="1357" y="747" class="s">app sin API (clínica)</text>

<text x="1345" y="496" class="s">Claude Haiku 5.5</text>

<!-- Harness -->
<rect x="740" y="110" width="540" height="140" rx="10" fill="#f1f3f7" stroke="#8a93a6"/>
<text x="756" y="136" class="t">Arnés de evaluación propio (packages/harness)</text>
<text x="756" y="158" class="s">__reset → POST /tasks (vía la URL pública) → sondeo c/5 s → __check</text>
<text x="756" y="177" class="s">+ chequeos de contrato: estado, "respuesta:", claves de razón, sin secretos</text>
<text x="756" y="196" class="s">pruebas E1–E5 + P1–P9 (cadenas, condicionales, homónimos, conteos)</text>
<text x="756" y="215" class="s">compuerta antes de gastar corridas: 14/14 en producción</text>
<text x="756" y="234" class="s">perfil de llave "dev" para no gastar el presupuesto del evento</text>
